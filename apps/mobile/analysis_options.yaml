# Flutter linter config
# See: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"      # generated by build_runner
    - "**/*.freezed.dart"
    - "**/*.gen.dart"
    - "build/**"

  errors:
    # Treat missing required parameters as errors
    missing_required_param: error
    missing_return: error

    # Allow `print` in dev (replace with logger before release)
    avoid_print: warning

    # Lower severity for some lints
    todo: ignore
    fixme: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Style
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true

    # Async safety
    use_build_context_synchronously: true
    avoid_void_async: true

    # Performance
    avoid_function_literals_in_foreach_calls: true

    # Naming
    camel_case_types: true
    constant_identifier_names: true
    file_names: true
