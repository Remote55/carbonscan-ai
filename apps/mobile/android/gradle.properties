org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ----------------------------------------------------------------------------
# Downgrade Kotlin JVM-target validation from ERROR to WARNING.
#
# Why: Flutter 3.27+ ships Kotlin 2.x which enforces strict JVM-target
# alignment between Java and Kotlin compile tasks. Many third-party plugins
# (tflite_flutter, shared_preferences_android, camera_android_camerax, etc.)
# still declare `compileOptions { sourceCompatibility = VERSION_1_8 }` in
# their own build.gradle, while our :app targets JVM 17. This mismatch is
# **forward-compatible** at runtime (Java 1.8 bytecode runs fine on JVM 17),
# but KGP 2.x treats it as a hard error.
#
# `warning` mode logs the inconsistency but lets the build proceed. This is
# the Flutter community-standard workaround documented at:
#   https://kotl.in/gradle/jvm/toolchain
# ----------------------------------------------------------------------------
kotlin.jvm.target.validation.mode=warning

# ----------------------------------------------------------------------------
# Disable Kotlin incremental compilation cache.
#
# Why: Kotlin 2.3.x on Windows + Gradle 9.x has a known issue where the new
# Build Tools API (btapi) fails to close incremental caches on Windows due to
# file-locking semantics. Error seen:
#   java.lang.Exception: Could not close incremental caches in
#     build/<plugin>/kotlin/compileDebugKotlin/cacheable/caches-jvm/jvm/kotlin:
#     class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
# Affects every plugin that uses Kotlin (tflite_flutter, camera_android_camerax,
# shared_preferences_android, url_launcher_android, geolocator_android, etc.)
#
# Disabling incremental compilation makes builds slightly slower (~10-20%)
# but they actually succeed. Re-enable when JetBrains ships a fix for KT-66344.
# ----------------------------------------------------------------------------
kotlin.incremental=false

# ----------------------------------------------------------------------------
# Use in-process Kotlin compiler instead of the daemon.
#
# Why: The Kotlin daemon strategy uses Build Tools API (btapi) which is the
# source of the cache-close failures above. Running in-process avoids the
# daemon entirely. Memory pressure is fine because we set org.gradle.jvmargs
# above to 8GB which is shared with the Kotlin compile work.
# ----------------------------------------------------------------------------
kotlin.compiler.execution.strategy=in-process

# Give the Kotlin daemon room when running in-daemon mode (fallback).
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
