name: carbonscan_mobile
description: "CarbonScan AI Mobile — สแกนต้นไม้ → คำนวณคาร์บอน"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Keep the declared minimum aligned with the SDK verified in local and CI gates.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management (Riverpod) ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Routing ---
  go_router: ^14.2.0

  # --- Networking ---
  dio: ^5.5.0
  dio_cache_interceptor: ^3.5.0

  # --- Camera & Sensors ---
  camera: ^0.11.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  image: ^4.2.0
  exif: ^3.3.0
  path_provider: ^2.1.3

  # --- ML / AI (on-device species classifier) ---
  # NOTE: tflite_flutter 0.10.x bundles TF Lite 2.12 whose AAR declares the
  # same `org.tensorflow.lite` namespace in tensorflow-lite, -lite-api and
  # -lite-gpu. AGP 9.x (Flutter 3.44+) rejects this with a hard error:
  #   "Namespace 'org.tensorflow.lite' is used in multiple modules"
  # We don't need the on-device classifier until Phase 2 (after the NSC
  # Proposal deadline), so we keep this disabled until we migrate to the
  # successor `litert` / `tflite_flutter_plus` packages that split namespaces.
  # See docs/decisions/0007-defer-ondevice-ml.md for the full rationale.
  # tflite_flutter: ^0.10.4

  # --- Storage ---
  shared_preferences: ^2.2.3

  # --- UI ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0

  # --- Auth (Supabase) ---
  supabase_flutter: ^2.5.6

  # --- Utility ---
  intl: ^0.19.0
  logger: ^2.4.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

  # --- Code generation annotations (no codegen yet — added in Phase 1) ---
  # freezed_annotation: ^2.4.4
  # json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code generation (uncomment in Phase 1 when adding @freezed/@riverpod classes) ---
  # CI pins Flutter 3.44.0 with Dart 3.12; re-evaluate these dependencies
  # when re-enabling codegen.
  # build_runner: ^2.4.11
  # freezed: ^2.5.2
  # json_serializable: ^6.7.1
  # riverpod_generator: ^2.4.0
  # riverpod_lint: ^2.3.13
  # custom_lint: ^0.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/ml_models/
    # Add tree_species_v1.tflite here once trained

  # Custom fonts (optional — currently using Google Fonts via package)
  # fonts:
  #   - family: Sarabun
  #     fonts:
  #       - asset: assets/fonts/Sarabun-Regular.ttf
  #       - asset: assets/fonts/Sarabun-Bold.ttf
  #         weight: 700
