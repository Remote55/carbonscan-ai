name: CI Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ci-web.yml"

# Allow only one CI run per ref at a time; cancel older ones
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-build:
    name: Lint + Type-check + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from root package.json "packageManager" field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Type-check
        working-directory: apps/web
        run: pnpm type-check

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: pnpm build

      - name: Upload build artifact (PR previews)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-pr-${{ github.event.pull_request.number }}
          path: apps/web/.next/
          retention-days: 7
          if-no-files-found: warn

  # Unit tests run in parallel with build to save time
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from root package.json "packageManager" field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/web
        # Call vitest directly (avoid pnpm CLI eating `--run` flag).
        # `--passWithNoTests` was here from before there were tests. There are
        # now, so collecting none means the runner is broken, and a green tick
        # for that is worse than a red one.
        run: pnpm exec vitest run

  # The browser gates. They existed and ran only when somebody remembered to run
  # them locally, which is another way of saying they did not run.
  e2e:
    name: Browser Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        # --with-deps pulls the system libraries the browser needs on a bare
        # runner. Chromium only: both Playwright projects use it, and the other
        # engines would double the install for no coverage.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        # playwright.config.ts serves the production build through
        # demo-server.cjs, because /demo verifies artifact hashes and that is
        # only meaningful against the files a real build emits.
        run: pnpm build

      - name: Run browser gates
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
