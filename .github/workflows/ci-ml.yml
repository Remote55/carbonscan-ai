name: CI ML

on:
  push:
    branches: [main]
    paths:
      - "services/ml/**"
      - "docs/evidence/core_demo_manifest.json"
      - "docs/evidence/pointnet_independent_eval/**"
      - "docs/CAPABILITY_MATRIX.md"
      - "docs/PROJECT_SPEC.md"
      - "docs/ml/PIPELINE.md"
      - "docs/ml/WOODLEAF_RESULTS.md"
      - "docs/ml/ALLOMETRIC.md"
      - "README.md"
      - "AGENTS.md"
      - "scripts/sync_truth.py"
      - "scripts/review_pointnet_evidence.py"
      - "scripts/build_truth_aligned_report.py"
      - "scripts/tests/**"
      - "docs/DOCUMENT_STATUS.md"
      - "proposal/**"
      - "services/api/README.md"
      - "apps/web/README.md"
      - "apps/mobile/README.md"
      - "apps/web/src/generated/core-demo-evidence.ts"
      - ".github/workflows/ci-ml.yml"
  pull_request:
    paths:
      - "services/ml/**"
      - "docs/evidence/core_demo_manifest.json"
      - "docs/evidence/pointnet_independent_eval/**"
      - "docs/CAPABILITY_MATRIX.md"
      - "docs/PROJECT_SPEC.md"
      - "docs/ml/PIPELINE.md"
      - "docs/ml/WOODLEAF_RESULTS.md"
      - "docs/ml/ALLOMETRIC.md"
      - "README.md"
      - "AGENTS.md"
      - "scripts/sync_truth.py"
      - "scripts/review_pointnet_evidence.py"
      - "scripts/build_truth_aligned_report.py"
      - "scripts/tests/**"
      - "docs/DOCUMENT_STATUS.md"
      - "proposal/**"
      - "services/api/README.md"
      - "apps/web/README.md"
      - "apps/mobile/README.md"
      - "apps/web/src/generated/core-demo-evidence.ts"
      - ".github/workflows/ci-ml.yml"

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + Test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ml/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libgl1 replaces libgl1-mesa-glx on Ubuntu 24.04+
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libgeos-dev \
            libproj-dev

      - name: Install Python dependencies (CPU)
        working-directory: services/ml
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first (faster than full GPU image)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install python-docx

      - name: Ruff lint
        working-directory: services/ml
        run: ruff check pipeline/ photogrammetry/ training/ scripts/ tests/ ../../scripts/*.py ../../scripts/tests/

      - name: Ruff format check (advisory)
        working-directory: services/ml
        # Phase 1: re-enable strict after running `ruff format .` locally.
        run: ruff format --check --diff pipeline/ photogrammetry/ training/ tests/ || echo "::warning::Ruff format drift"

      - name: Run allometric tests
        working-directory: services/ml
        run: pytest tests/test_allometric.py -v --cov=pipeline.allometric --cov-report=term-missing

      - name: Run all tests
        working-directory: services/ml
        run: pytest tests/ -v --tb=short

      - name: Run repository truth and report contract tests
        run: python -m pytest scripts/tests/ -v --no-cov

      - name: Verify deterministic core demo
        working-directory: services/ml
        run: python scripts/run_core_demo.py --output-dir ../../temp/ci-core-demo --repo-root ../..

      - name: Verify evidence and documentation truth
        working-directory: services/ml
        run: python ../../scripts/sync_truth.py --check
