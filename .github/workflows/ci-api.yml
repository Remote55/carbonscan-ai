name: CI API

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/ci-api.yml"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Sidecar Postgres + PostGIS for integration tests
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev

      - name: Install Python dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: services/api
        run: ruff check .

      - name: Ruff format check
        working-directory: services/api
        run: ruff format --check .

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/carbonscan_test
          JWT_SECRET: test-secret-key-for-ci-only-do-not-use-in-prod
          APP_ENV: test
          APP_DEBUG: "false"
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.run_id }}
          path: services/api/coverage.xml
          retention-days: 7
          if-no-files-found: ignore
