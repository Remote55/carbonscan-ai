name: CI API

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/ci-api.yml"
      # The image copies the ML pipeline in — the analyze route shells out to
      # it — so a pipeline change can break the build without touching
      # services/api. Leaving it out would mean the one job that builds the
      # image does not run when the image's contents change.
      - "services/ml/pipeline/**"
      - "services/ml/data/**"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/ci-api.yml"
      # The image copies the ML pipeline in — the analyze route shells out to
      # it — so a pipeline change can break the build without touching
      # services/api. Leaving it out would mean the one job that builds the
      # image does not run when the image's contents change.
      - "services/ml/pipeline/**"
      - "services/ml/data/**"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Sidecar Postgres + PostGIS for integration tests
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev

      - name: Install Python dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: services/api
        run: ruff check .

      - name: Ruff format check (advisory)
        working-directory: services/api
        # Phase 1: re-enable strict (without `|| true`) after running
        # `ruff format .` locally and committing normalized files.
        run: ruff format --check --diff . || echo "::warning::Ruff format drift"

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/carbonscan_test
          JWT_SECRET: test-secret-key-for-ci-only-do-not-use-in-prod
          APP_ENV: test
          APP_DEBUG: "false"
        # pyproject.toml's pytest config already includes --cov=app, --cov-report=term-missing
        # We add xml report on top for coverage upload.
        run: pytest --cov-report=xml

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.run_id }}
          path: services/api/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # Nothing built this image. It had been broken since it was written - the
  # dependency install failed on a missing README.md, which pyproject declares
  # and hatchling reads as a build input - and the tests above could not notice,
  # because they run against the source tree and not the image. A container that
  # is never built is a deployment plan, not an artifact.
  #
  # Deliberately not pushed anywhere: the point is that `docker build` succeeds
  # and the thing it produces answers, not to publish a registry tag.
  docker-image:
    name: Build the image and check it answers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Context is the repository root, not services/api: the image carries the
      # ML pipeline the analyze route shells out to. GIT_COMMIT is not optional
      # - process_points refuses to start a run it cannot attribute.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          load: true
          tags: treeq-api:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        run: |
          docker run -d --name treeq-api -p 8000:8000 \
            -e TREEQ_DEMO_MODE=false \
            treeq-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::the container never became healthy"
          docker logs treeq-api
          exit 1

      # /health only says uvicorn is up. The previous image passed that while
      # every analysis failed, because the ML pipeline was not in it.
      # /health/pipeline imports the orchestrator in its own runtime.
      - name: Check the pipeline is actually in the image
        run: |
          body=$(curl -fsS --max-time 120 http://localhost:8000/api/v1/health/pipeline) || {
            echo "::error::/health/pipeline did not answer"
            docker logs treeq-api
            exit 1
          }
          echo "$body"
          echo "$body" | grep -q '"pipeline_version"' || {
            echo "::error::readiness answered without a pipeline version"
            exit 1
          }

      # The route the product is. A 200 here is the first end-to-end proof that
      # a built image can measure a tree.
      - name: Analyse a point cloud through the built image
        run: |
          printf 'ply\nformat ascii 1.0\nelement vertex 3\nproperty float x\nproperty float y\nproperty float z\nend_header\n0 0 0\n0 0 1\n0 0 2\n' > tiny.ply
          code=$(curl -s -o response.json -w '%{http_code}' --max-time 300 \
            -F 'file=@tiny.ply' http://localhost:8000/api/v1/upload/analyze)
          echo "HTTP $code"; cat response.json
          # A cloud this small has no tree in it, so 200 with zero measured
          # trees is the correct answer. What must not happen is 5xx, which is
          # what a missing pipeline or a broken subprocess looks like.
          case "$code" in
            5*) echo "::error::analyze failed inside the image"; docker logs treeq-api; exit 1 ;;
          esac

      - name: Container logs
        if: always()
        run: docker logs treeq-api || true

      - name: Stop
        if: always()
        run: docker rm -f treeq-api || true
