[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonscan-api"
version = "0.1.0"
description = "CarbonScan AI Backend API — NSC 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CarbonScan AI Team" }]
keywords = ["carbon-credit", "lidar", "fastapi", "nsc-2026"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # External services
    "supabase>=2.5.0",
    "httpx>=0.27.0",

    # Async/Queue
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Geospatial helpers
    "shapely>=2.0.0",

    # PDF generation
    "reportlab>=4.2.0",

    # Logging
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
    "ipdb>=0.13.13",
    "factory-boy>=3.3.0",
]

[project.urls]
Repository = "https://github.com/Remote55/carbonscan-ai"
Issues = "https://github.com/Remote55/carbonscan-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "ASYNC", # async checks
    "C4",  # comprehensions
    "PIE", # misc
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py311"]

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
