[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonscan-ml"
version = "0.1.0"
description = "CarbonScan AI ML Pipeline — LiDAR Wood-Leaf Segmentation + QSM + Allometric"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CarbonScan AI Team" }]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "scikit-image>=0.23.0",
    "pandas>=2.2.0",

    # Point cloud
    "open3d>=0.18.0",
    "laspy[lazrs]>=2.5.0",

    # Geo
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",

    # Image
    "pillow>=10.3.0",
    "opencv-python-headless>=4.10.0",

    # Utility
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# CPU dev (no CUDA — for development on laptops)
cpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]

# GPU production (NVIDIA CUDA 11.8+)
gpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # Point cloud DL extensions (require CUDA at install time):
    # Install via: pip install torch-scatter -f https://data.pyg.org/whl/torch-2.3.0+cu118.html
    # "torch-scatter",
    # "torch-sparse",
    # "torch-cluster",
]

# RunPod serverless
runpod = [
    "runpod>=1.6.0",
]

dev = [
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "wandb>=0.17.0",
]

[project.scripts]
carbonscan-pipeline = "pipeline.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "photogrammetry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "PIE", "RUF", "NPY"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", # ambiguous unicode in strings (× and ρ are intentional in math docs)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "N803",   # function args lowercase (allow physics/math variable names)
    "N806",   # variable in function should be lowercase (allow math notation)
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--cov=pipeline", "--cov-report=term-missing"]
markers = [
    "slow: marks tests as slow",
    "gpu: requires GPU",
]
